name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify lint made no changes
        run: git diff --exit-code

      - name: Build
        run: npm run build

      - name: Verify theme output layout
        run: |
          # CF-Server-Monitor 只读取主题目录里的 index.html 和 assets/
          extra=$(find dist -mindepth 1 -maxdepth 1 ! -name index.html ! -name assets)
          if [ -n "$extra" ]; then
            echo "Unexpected files in dist:"; echo "$extra"; exit 1
          fi
